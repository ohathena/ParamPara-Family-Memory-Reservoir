# Render Blueprint: creates the API (free web service) and the website (free static site) in one go.
# Render dashboard -> New -> Blueprint -> pick this repository. See DEPLOY.md for the full walkthrough.
services:
  # ---------- backend API ----------
  - type: web
    name: parampara-api
    runtime: node
    plan: free
    region: singapore          # closest Render region to India
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health/ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true     # Render makes a long random secret for you
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MONGO_URI
        sync: false             # you paste this in the dashboard (MongoDB Atlas connection string)
      - key: CLIENT_URL
        sync: https://parampara-web.onrender.com             # the website address, e.g. https://parampara-web.onrender.com
      # optional: password reset emails (Brevo, free)
      - key: EMAIL_PROVIDER
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # optional: photo uploads (Cloudinary, free)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # ---------- frontend website ----------
  - type: web
    name: parampara-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    autoDeploy: true
    buildFilter:
      paths:
        - frontend/**
    envVars:
      - key: VITE_API_URL
        sync: https://parampara-api-b1s0.onrender.com/api            # the API address + /api, e.g. https://parampara-api.onrender.com/api
    routes:
      # single page app: every path is served by index.html, React Router takes over
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
